name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  sizes:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Re-run the deterministic part of the sweep and require the committed result
        run: |
          cargo run --release --bin status-list-herd -- --sizes-only --out "$RUNNER_TEMP/r"
          diff results/sizes.csv "$RUNNER_TEMP/r/sizes.csv"
          diff results/freshness.csv "$RUNNER_TEMP/r/freshness.csv"
